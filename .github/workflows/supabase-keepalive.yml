name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not configured."
            exit 1
          fi
          for i in 1 2 3; do
            if curl -fsS --max-time 20 \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/projects?select=id&limit=1" \
              > /dev/null; then
              echo "keep-alive ok (rest, attempt $i)"
              exit 0
            fi
            echo "::warning::rest ping attempt $i/3 failed, retrying..."
            [ "$i" -lt 3 ] && sleep $((i * 10))
          done
          echo "::warning::rest ping failed after 3 attempts, checking auth health for diagnosis..."
          if curl -fsS --max-time 20 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/auth/v1/health" \
            > /dev/null; then
            echo "::warning::auth is reachable but rest failed — check RLS/policies on public.projects."
          fi
          echo "::error::Supabase keep-alive failed after 3 attempts."
          exit 1

      - name: Comment volume check (24h)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          headers=$(curl -fsS -D - -o /dev/null --max-time 20 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Prefer: count=exact" \
            -H "Range: 0-0" \
            "$SUPABASE_URL/rest/v1/portfolio_comments?select=id&created_at=gte.$since" || true)
          count=$(printf '%s' "$headers" | tr -d '\r' | sed -n 's/^[Cc]ontent-[Rr]ange:.*\///p' | tail -n 1)
          echo "comments in last 24h: ${count:-unknown}"
          # 30/day is far above real traffic for this site. A failure emails the
          # repo owner via GitHub's scheduled-workflow notification.
          if [ -n "$count" ] && [ "$count" -gt 30 ] 2>/dev/null; then
            echo "::error::$count comments in the last 24h — possible spam flood. Review public.portfolio_comments."
            exit 1
          fi
